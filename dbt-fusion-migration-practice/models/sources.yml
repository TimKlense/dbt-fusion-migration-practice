version: 2

sources:
  - name: raw_data
    description: Raw data from CSV seeds
    database: "{{ target.database }}"
    schema: "{{ target.schema }}"
    tables:
      - name: raw_customers
        description: Raw customer data
        # DEPRECATED: Old source freshness syntax
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        loaded_at_field: signup_date
        columns:
          - name: customer_id
            description: Primary key
            # DEPRECATED: tests at source column level using old syntax
            tests:
              - unique
              - not_null
      
      - name: raw_orders
        description: Raw order data
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        loaded_at_field: order_date
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
          
          - name: customer_id
            tests:
              - not_null
      
      - name: raw_products
        description: Raw product data
        columns:
          - name: product_id
            tests:
              - unique
              - not_null

# NOTE: The freshness syntax above uses the old format with count/period
# Modern syntax should be: warn_after: { count: 12, period: hour } (same structure but dbt may deprecate certain patterns)

